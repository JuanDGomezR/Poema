<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Para Ti, Mi Amor</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="background-overlay"></div>
    <div class="main-screen">
      <h1>Siempre Tú</h1>
      <div class="initial-message">
        <p>Haz clic para revelar el mensaje</p>
        <div class="initial-heart-button">&#x2764;</div>
      </div>
    </div>

    <div class="content-wrapper hidden">
      <div class="left-section">
        <div class="image-container">
          <img src="foto.jpg" alt="Nuestra foto juntos" />
          <div class="photo-overlay"></div>
        </div>
        <div id="countdown" class="countdown-display"></div>
      </div>

      <div class="center-heart-display">
        <svg viewBox="0 0 100 92">
          <path
            d="M8.57864 8.57864C20.0168 -2.85955 38.5618 -2.85955 50 8.57864C61.4382 -2.85955 79.9832 -2.85955 91.4214 8.57864C102.86 20.0168 102.86 38.5618 91.4214 50C91.4162 50.0052 91.411 50.0104 91.4058 50.0156L50 91.4213L8.59924 50.0206C8.59237 50.0137 8.58551 50.0069 8.57864 50C-2.85955 38.5618 -2.85955 20.0168 8.57864 8.57864Z"
            fill="currentcolor"
          />
        </svg>
      </div>

      <div class="right-section">
        <h2 class="poem-title">Un Sincero Ruego</h2>
        <div id="forgivenessPoem" class="poem-text"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
